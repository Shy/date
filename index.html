<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="A dating app with exactly one match available." />
    <title>Shy.Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <main class="smartphone">
      <div class="screen">
        <div class="deck" aria-live="polite"></div>
        <template id="card-template">
          <figure class="photo">
            <span class="stamp stamp-like" aria-hidden="true">LIKE</span>
            <span class="stamp stamp-super" aria-hidden="true">SUPER<br />LIKE</span>
            <figcaption class="personal">
              <div class="name-age">
                <h1 class="name">Shy</h1>
                <span class="age">35</span>
              </div>
              <div class="about">
                <i data-lucide="briefcase" aria-hidden="true"></i>
                <p data-field="job"></p>
                <i data-lucide="graduation-cap" aria-hidden="true"></i>
                <p data-field="company"></p>
                <i data-lucide="map-pin" aria-hidden="true"></i>
                <p data-field="location"></p>
              </div>
            </figcaption>
          </figure>
        </template>
        <nav class="commands">
          <button class="command small nope" type="button" data-reaction="dislike" aria-label="Nope">
            <i data-lucide="x"></i>
          </button>
          <button class="command super" type="button" data-reaction="super_like" aria-label="Super like">
            <i data-lucide="star"></i>
          </button>
          <button class="command small heart" type="button" data-reaction="like" aria-label="Like">
            <i data-lucide="heart"></i>
          </button>
        </nav>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
