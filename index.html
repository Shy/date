<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>CodePen - Tinder clone with HammerJS</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="bg-image"></div>

        <!-- partial:index.partial.html -->
        <div class="smartphone">
            <div class="screen">
                <div class="person">
                    <figure class="photo">
                        <div class="personal">
                            <div class="name-age">
                                <h2 class="name">Shy</h2>
                                <h2 class="age">32</h2>
                            </div>
                            <div class="data">
                                <div class="about">
                                    <div class="about-icon">
                                        <i class="fa-solid fa-suitcase"></i>
                                        <i class="fa-solid fa-graduation-cap"></i>
                                        <i class="fa-solid fa-location-dot"></i>
                                    </div>
                                    <div class="about-text">
                                        <p>Boring Tech Bro</p>
                                        <p>Misc. Tech company</p>
                                        <p>Brooklyn</p>
                                    </div>
                                </div>
                                <div class="info">
                                    <i class="fa-solid fa-circle-info"></i>
                                </div>
                            </div>
                        </div>
                    </figure>
                </div>
                <div class="commands">
                    <div class="command">
                        <i class="fa-solid fa-close"></i>
                    </div>
                    <div class="command">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="command">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                </div>
            </div>
        </div>
        <!-- Font Awesome -->
        <script
            src="https://kit.fontawesome.com/41e808b0fd.js"
            crossorigin="anonymous"
        ></script>
        <!-- partial -->
        <script type="module" src="./script.js"></script>
    </body>
</html>
